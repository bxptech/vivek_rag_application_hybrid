name: Dependency Check & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --use-deprecated=legacy-resolver || exit 1

      - name: Check for dependency conflicts
        run: |
          pip check

      - name: Run basic sanity test
        run: |
          python -c "import streamlit; import langchain; print('✅ Dependencies OK')"
